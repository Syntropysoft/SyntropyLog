# Build the Rust addon (syntropylog-native) for every supported target.
# Native targets build on their own runner; Linux server targets (arm64 / musl)
# are cross-compiled with zig (via cargo-zigbuild, which napi drives with --zig).
# A final job merges all .node files into one addon package, and an Alpine
# smoke job then EXECUTES the x64 musl binary in a real container (cross-
# compiling proves it links, not that it loads) plus the no-addon JS-fallback
# contract. arm64 targets remain build-only (no arm64 runner).
name: Build native addon

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Native (built on a matching runner; binary is runnable → tested) ---
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, test: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          # --- Cross-compiled (not runnable on the runner → build only) ---
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: cargo
          cache-target: syntropylog-native/target

      - name: Setup zig (cross-compile)
        if: ${{ matrix.zig }}
        shell: bash
        run: |
          # Download the tagged release directly from ziglang.org/download (verified
          # 200) instead of mlugg/setup-zig: its community mirrors were down (503/404)
          # and its "official" fallback hits ziglang.org/builds — the DEV build index,
          # which 404s for tagged releases. Direct download is reliable and under our
          # control. Every zig matrix entry cross-compiles ON the x64 Ubuntu runner.
          ZIG_VERSION=0.15.1
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Install cargo-zigbuild (cross-compile)
        if: ${{ matrix.zig }}
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-zigbuild@0.22.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build addon
        shell: bash
        run: |
          cd syntropylog-native
          # Pin the napi CLI to the exact 2.x version via dlx. `pnpm exec napi`
          # was resolving napi 3.x in CI (which dropped --zig for --cross-compile),
          # breaking the cross-compile step; dlx@2.18.4 runs the version that has
          # --zig deterministically, independent of workspace resolution.
          pnpm dlx @napi-rs/cli@2.18.4 build --platform --release --target ${{ matrix.target }} ${{ matrix.zig && '--zig' || '' }}
          node scripts/patch-index-no-shell.js

      - name: Test addon (native targets only)
        if: ${{ matrix.test }}
        shell: bash
        run: cd syntropylog-native && node test-node.mjs

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.target }}
          path: |
            syntropylog-native/*.node
            syntropylog-native/index.js
            syntropylog-native/index.d.ts

  merge:
    name: Merge platform artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all addon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: artifacts
          merge-multiple: true

      - name: Flatten into single addon package
        run: |
          mkdir -p addon-package
          f_js=$(find artifacts -name index.js | head -1)
          f_ts=$(find artifacts -name index.d.ts | head -1)
          [ -n "$f_js" ] && cp "$f_js" addon-package/
          [ -n "$f_ts" ] && cp "$f_ts" addon-package/
          find artifacts -name "*.node" -exec cp {} addon-package/ \;
          echo "Package contents:"
          ls -la addon-package/

      - name: Upload merged addon (all platforms)
        uses: actions/upload-artifact@v4
        with:
          name: syntropylog-native-all-platforms
          path: addon-package

  # Both halves of the failsafe, asserted against the packed artifacts on real
  # Alpine (musl): the cross-compiled binary actually LOADS, and with the
  # optional addon omitted the JS pipeline serves the same masked output while
  # reporting the absence via onSerializationFallback. See scripts/native-smoke.mjs.
  alpine-smoke:
    name: Alpine smoke (musl binary + JS-fallback contract)
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm run build

      - name: Download merged addon into the package dir
        uses: actions/download-artifact@v4
        with:
          name: syntropylog-native-all-platforms
          path: syntropylog-native

      - name: Pack consumer tarballs
        run: |
          mkdir -p smoke/pkg smoke/native
          pnpm pack --pack-destination smoke/pkg
          cd syntropylog-native && npm pack --pack-destination ../smoke/native
          ls -la ../smoke/pkg ../smoke/native

      # The script is COPIED into the consumer dir before running: ESM resolves the
      # bare 'syntropylog' specifier relative to the script's own path, so running it
      # from /repo would load the checked-out workspace instead of the packed tarball.
      - name: "Smoke 1: musl binary loads on Alpine (native engine active)"
        run: |
          docker run --rm -v "$PWD:/repo" -w /smoke node:20-alpine sh -ec '
            npm init -y >/dev/null
            npm i --no-audit --no-fund /repo/smoke/native/*.tgz /repo/smoke/pkg/*.tgz
            cp /repo/scripts/native-smoke.mjs .
            EXPECT_NATIVE=true node native-smoke.mjs
          '

      - name: "Smoke 2: addon omitted → JS fallback, same masked output, reported"
        run: |
          docker run --rm -v "$PWD:/repo" -w /smoke node:20-alpine sh -ec '
            npm init -y >/dev/null
            npm i --no-audit --no-fund --omit=optional /repo/smoke/pkg/*.tgz
            cp /repo/scripts/native-smoke.mjs .
            EXPECT_NATIVE=false node native-smoke.mjs
          '
